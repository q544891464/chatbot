server {
    listen 8443 ssl;
    http2 on;
    server_name 127.0.0.1 172.17.151.186 172.18.0.1 172.19.0.1 198.18.0.1 182.92.153.82;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/chatbot-selfsigned.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/chatbot-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CHATBOTSSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
